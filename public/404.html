<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vive Utrera</title>
    <script>
      var repositoryBase = '/viveutrera';
      var isRepositoryPath = location.pathname === repositoryBase || location.pathname.indexOf(repositoryBase + '/') === 0;
      var target = isRepositoryPath ? repositoryBase + '/' : '/';
      sessionStorage.redirect = location.href;
      location.replace(target);
    </script>
  </head>
  <body>
    Redirigiendo a Vive Utrera...
  </body>
</html>
